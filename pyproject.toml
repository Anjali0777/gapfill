[project]
name = "gapfill"
version = "0.1.0"
description = "Recovering an exchange order book from a lossy, sequenced market-data feed: range gap-fill with snapshot fallback vs full replay."
authors = [{ name = "Anjali Gupta" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6.100"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["gapfill"]
